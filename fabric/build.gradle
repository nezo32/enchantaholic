plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
}

version = project.mod_version
group = project.maven_group

base {
	archivesName = project.archives_base_name
}

// Target Minecraft version: 26.3 by default, override with -Pmc=26.2.
def mc = project.property('mc').toString()
def fabricApiVersion = project.findProperty("fabric_api_${mc.replace('.', '_')}")
if (fabricApiVersion == null) {
	throw new GradleException("Unsupported -Pmc=${mc}. Supported: 26.3, 26.2")
}

repositories {}

loom {
	splitEnvironmentSourceSets()

	mods {
		"enchantaholic" {
			sourceSet sourceSets.main
			sourceSet sourceSets.client
		}
	}
}

fabricApi {
	// creates the src/gametest source set + runGameTest (server, headless, part of `build`)
	// and runClientGameTest (needs a display) tasks
	configureTests {
		createSourceSet = true
		modId = "enchantaholic-gametest"
		enableGameTests = true
		enableClientGameTests = true
		eula = true
	}
}

dependencies {
	minecraft "com.mojang:minecraft:${mc}"
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"
	implementation "net.fabricmc.fabric-api:fabric-api:${fabricApiVersion}"

	testImplementation "org.junit.jupiter:junit-jupiter:5.13.4"
	testRuntimeOnly "org.junit.platform:junit-platform-launcher"
}

test {
	// working dir defaults to the project dir (CorePurityTest reads src/main/java)
	useJUnitPlatform()
}

processResources {
	def version = project.version
	inputs.property "version", version
	filesMatching("fabric.mod.json") {
		expand "version": version
	}
}

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(25)
	}
	withSourcesJar()
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 25
}

tasks.named('jar') {
	def license = rootProject.file('../LICENSE')
	if (license.exists()) {
		from(license) {
			rename { "LICENSE_enchantaholic" }
		}
	}
}
