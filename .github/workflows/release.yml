# Enchantaholic release: push tag vX.Y.Z[-pre] (on a commit of main) ->
#   version -> build-mod || build-addon -> github-release -> curseforge-mod || curseforge-addon
# Or: Actions -> Release -> Run workflow on main with create-tag to cut the tag from the UI.
# Everything runs in ONE workflow run: releases created with GITHUB_TOKEN never trigger other workflows.
# This repo calls the reusable workflows by local path. Other repos: copy .github/templates/release-caller.yml
# (see docs/ci/REUSABLE_RELEASE_PIPELINE.md). Maintainer runbook: docs/ci/RELEASING.md.
#
# Repo config: secret CURSEFORGE_TOKEN; var CURSEFORGE_PROJECT_ID (empty = CurseForge skipped);
# optional vars CURSEFORGE_GAME_VERSIONS, CURSEFORGE_BEDROCK_PROJECT_ID, CURSEFORGE_BEDROCK_API_BASE,
# CURSEFORGE_BEDROCK_GAME_VERSIONS.
name: Release

on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Tag to (re)build, release and publish, e.g. v1.2.3 (must exist unless create-tag is set)
        required: true
      create-tag:
        description: Create the tag on the current tip of main first (run the workflow from main)
        type: boolean
        default: false
      skip-curseforge:
        description: Only (re)build and update the GitHub release; do not upload to CurseForge
        type: boolean
        default: false
      curseforge-dry-run:
        description: Resolve CurseForge versions and print the upload metadata without uploading
        type: boolean
        default: false

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # Optional: cut the tag from the Actions tab instead of pushing it. A tag created with GITHUB_TOKEN does not
  # start another run, so the release continues in this one.
  create-tag:
    if: ${{ inputs.create-tag }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Create tag on main
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
          REF: ${{ github.ref }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          [[ "$REF" == refs/heads/main ]] || { echo "::error::Run the workflow from main to create a tag (got $REF)"; exit 1; }
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]] || { echo "::error::Tag '$TAG' is not vX.Y.Z[-pre]"; exit 1; }
          if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG" >/dev/null 2>&1; then
            echo "::error::Tag $TAG already exists; re-run without create-tag to rebuild it"; exit 1
          fi
          gh api "repos/$GITHUB_REPOSITORY/git/refs" -f ref="refs/tags/$TAG" -f sha="$SHA" >/dev/null
          echo "Created $TAG at $SHA" | tee -a "$GITHUB_STEP_SUMMARY"

  version:
    needs: create-tag
    if: ${{ !cancelled() && needs.create-tag.result != 'failure' }}
    uses: ./.github/workflows/reusable-version.yml
    with:
      tag: ${{ inputs.tag }}
      release-branch: main

  build-mod:
    needs: version
    if: ${{ !cancelled() && !failure() }}
    uses: ./.github/workflows/reusable-build-gradle.yml
    with:
      ref: ${{ needs.version.outputs.tag }}
      working-directory: fabric
      java-version: "25"
      version: ${{ needs.version.outputs.version }}
      artifact-name: fabric-mod
      artifact-files: build/libs/enchantaholic-*.jar

  build-addon:
    needs: version
    if: ${{ !cancelled() && !failure() }}
    uses: ./.github/workflows/reusable-build-node.yml
    with:
      ref: ${{ needs.version.outputs.tag }}
      working-directory: bedrock
      check-command: npm run typecheck --if-present && npm run lint --if-present && npm test --if-present
      build-command: npm run package
      version: ${{ needs.version.outputs.version }}
      artifact-name: bedrock-addon
      artifact-files: dist/enchantaholic-*.mcaddon

  github-release:
    needs: [version, build-mod, build-addon]
    if: ${{ !cancelled() && !failure() }}
    permissions:
      contents: write
    uses: ./.github/workflows/reusable-github-release.yml
    with:
      tag: ${{ needs.version.outputs.tag }}
      name: Enchantaholic ${{ needs.version.outputs.version }}
      prerelease: ${{ needs.version.outputs.prerelease == 'true' }}
      artifact-pattern: "{fabric-mod,bedrock-addon}"

  curseforge-mod:
    needs: [version, github-release]
    if: ${{ !cancelled() && !failure() && !inputs.skip-curseforge }}
    uses: ./.github/workflows/reusable-publish-curseforge.yml
    with:
      # Read inside the job so repository- and Environment-level variables both work.
      project-id-var: CURSEFORGE_PROJECT_ID
      environment: ${{ vars.CURSEFORGE_ENVIRONMENT || 'Enchantaholic' }}
      artifact-pattern: fabric-mod
      primary-file: "enchantaholic-!(*-sources).jar"
      additional-files: "enchantaholic-*-sources.jar"
      # When a 26.2.x / 26.3.x patch ships, add it to the repo var; no code change needed.
      game-versions: ${{ vars.CURSEFORGE_GAME_VERSIONS || '26.2,26.3,Fabric,Java 25,Client,Server' }}
      release-type: ${{ needs.version.outputs.release-type }}
      display-name: Enchantaholic ${{ needs.version.outputs.version }} (Fabric)
      relations: fabric-api:requiredDependency
      tag: ${{ needs.version.outputs.tag }}
      dry-run: ${{ inputs.curseforge-dry-run == true }}
    secrets:
      CURSEFORGE_TOKEN: ${{ secrets.CURSEFORGE_TOKEN }}

  curseforge-addon:
    needs: [version, github-release]
    if: ${{ !cancelled() && !failure() && !inputs.skip-curseforge }}
    uses: ./.github/workflows/reusable-publish-curseforge.yml
    with:
      # Read inside the job so repository- and Environment-level variables both work.
      project-id-var: CURSEFORGE_BEDROCK_PROJECT_ID
      environment: ${{ vars.CURSEFORGE_ENVIRONMENT || 'Enchantaholic' }}
      api-base: ${{ vars.CURSEFORGE_BEDROCK_API_BASE || 'https://minecraft-bedrock.curseforge.com' }}
      artifact-pattern: bedrock-addon
      primary-file: "enchantaholic-*.mcaddon"
      game-versions: ${{ vars.CURSEFORGE_BEDROCK_GAME_VERSIONS || '26.50' }}
      version-type-prefixes: ""
      release-type: ${{ needs.version.outputs.release-type }}
      display-name: Enchantaholic ${{ needs.version.outputs.version }} (Bedrock)
      tag: ${{ needs.version.outputs.tag }}
      dry-run: ${{ inputs.curseforge-dry-run == true }}
    secrets:
      CURSEFORGE_TOKEN: ${{ secrets.CURSEFORGE_TOKEN }}
